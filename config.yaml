---
version: 3.0.4
slug: ezddns-dev
name: EZ DDNS DEV
description: >
  DEVELOPMENT BRANCH! DONT USE IN PRODUCTION!!!
url: https://github.com/TKtheDEV/EZDDNS-HomeAssistant/tree/dev
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
hassio_api: true
init: false

options:
  supervisorToken: null
  zoneId: null
  apiToken: null
  hostfqdn: null
  v4Enabled: false
  prefixLength: 56
  refresh: 300
  dnsttl: 1
  proxied: false
  legacyMode: false
  customEnabled: false
  customRecords:
#   - AAAAcustom.example.com,AAAA,56:0123:45ff:fe67:89ab
#   - AAAA.example.com,AAAA
#   - A.example.com,A

schema:
  supervisorToken: password
  zoneId: str?
  apiToken: password
  hostfqdn: str?
  v4Enabled: bool
  prefixLength: list(48|52|56|60|64)
  refresh: "int(60,)"
  dnsttl: "int(1,86400)"
  proxied: bool
  legacyMode: bool
  customEnabled: bool
  customRecords:
    - str?

environment:
  SUPERVISOR_TOKEN: "{supervisorToken}"
  ZONE_ID: "{zoneId}"
  API_TOKEN: "{apiToken}"
  HOSTFQDN: "{hostfqdn}"
  V4_ENABLED: "{v4Enabled}"
  PREFIX_LENGTH: "{prefixLength}"
  REFRESH: "{refresh}"
  DNS_TTL: "{dnsttl}"
  PROXIED: "{proxied}"
  LEGACY_MODE: "{legacyMode}"
  CUSTOM_ENABLED: "{customEnabled}"
  CUSTOM_RECORDS: "{customRecords}"
